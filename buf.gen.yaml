version: v2
clean: false
plugins:
  - local: protoc-gen-go
    out: go/gen
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: go/gen
    opt:
      - paths=source_relative
  - local:
      - node
      - node_modules/@bufbuild/protoc-gen-es/bin/protoc-gen-es
    out: src/generated
    opt:
      - target=ts
      - import_extension=js
inputs:
  - directory: proto
