name: Bug report
description: Something in the observer does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please remove access keys, tokens, prompts
        and file paths you do not want to be public before you submit.
        Report security problems privately instead; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `phigon-observer ...`
        2. ...
  - type: input
    id: version
    attributes:
      label: Observer version
      description: The output of `phigon-observer --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04, ...
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent
      description: The AI agent involved, if any, and its version.
      placeholder: Claude Code 2.1, Codex CLI 0.40, ...
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: The output of `phigon-observer doctor`, with anything private removed.
      render: text
