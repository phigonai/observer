name: Feature request
description: Suggest a new agent, signal, or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and why the observer does not help today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you would like it to work.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you have tried or considered.
