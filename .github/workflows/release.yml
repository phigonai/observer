name: Release

# A version tag (vX.Y.Z) is pushed by the sync workflow when Phigon tags
# observer-vX.Y.Z upstream. This publishes that exact commit to npm.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.x"
          cache-dependency-path: go/go.sum
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          }
      - name: Install npm with trusted publishing
        run: npm install --global npm@11.18.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Build Guardian runners for every platform
        run: npm run build:platforms
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
